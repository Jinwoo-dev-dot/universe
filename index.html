<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우주론 암기장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a student's own lab notebook. Graph-paper page, blue-pen headings in handwriting,
   highlighter over every key word; turn on "빈칸 가리기" and the highlighter becomes solid so you test yourself. */
:root {
  --paper: #F5F8F3;
  --sheet: #FFFFFF;
  --ink: #1D2924;
  --muted: #5F6D66;
  --line: #DCE4DD;
  --grid: rgba(45, 110, 80, .075);
  --pen: #2850C8;
  --hl: #FFE55A;
  --hl-soft: rgba(255, 229, 90, .55);
  --pink: #FF9DB8;
  --good: #2A7D4F;
  --bad: #CF3F3F;
  --mid: #B7770B;
  --shadow: 0 1px 2px rgba(29, 41, 36, .06), 0 10px 26px rgba(29, 41, 36, .07);
  --font-hand: "Gaegu", "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111815; --sheet: #18221D; --ink: #E4ECE6; --muted: #9AAAA1; --line: #2A3830; --grid: rgba(140, 210, 170, .06);
    --pen: #8EA9FF; --hl: #C9AE2A; --hl-soft: rgba(214, 186, 50, .35); --pink: #D9708F; --good: #5ACB8C; --bad: #FF7B72; --mid: #E6AE48;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111815; --sheet: #18221D; --ink: #E4ECE6; --muted: #9AAAA1; --line: #2A3830; --grid: rgba(140, 210, 170, .06);
  --pen: #8EA9FF; --hl: #C9AE2A; --hl-soft: rgba(214, 186, 50, .35); --pink: #D9708F; --good: #5ACB8C; --bad: #FF7B72; --mid: #E6AE48;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.75; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
[hidden] { display: none !important; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { max-width: 1160px; margin: 0 auto; padding: 22px 20px 80px; display: flex; flex-direction: column; gap: 18px; }

.btn { border: 1.5px solid var(--line); background: var(--sheet); border-radius: 12px; padding: 7px 14px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--ink); }
.btn:active { transform: translateY(1px); }
.btn.ink { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.pen { background: var(--pen); border-color: var(--pen); color: #fff; }
.btn.sm { padding: 3px 10px; font-size: 14px; border-radius: 9px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Header */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.title { margin: 0; font-family: var(--font-hand); font-weight: 700; font-size: 52px; line-height: 1; letter-spacing: -0.01em; }
.title { display: flex; align-items: center; gap: 10px; }
.doodle { width: 48px; height: 48px; flex: none; transform: rotate(-8deg); }
.title mark { background: linear-gradient(transparent 55%, var(--hl) 55%, var(--hl) 88%, transparent 88%); color: inherit; padding: 0 4px; }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 14px; padding: 6px 14px; display: flex; flex-direction: column; min-width: 104px; }
.stat b { font-family: var(--font-hand); font-size: 28px; line-height: 1.05; font-weight: 700; }
.stat span { font-size: 12.5px; color: var(--muted); }
.stat i { display: block; height: 4px; border-radius: 3px; background: var(--line); margin-top: 4px; overflow: hidden; }
.stat i::after { content: ""; display: block; height: 100%; width: var(--p, 0%); background: var(--good); border-radius: 3px; }

.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--ink); overflow-x: auto; }
.tab { border: 2px solid transparent; border-bottom: 0; background: none; padding: 8px 16px 6px; font-family: var(--font-hand); font-size: 22px; font-weight: 700; color: var(--muted); border-radius: 12px 12px 0 0; margin-bottom: -2px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-pressed="true"] { color: var(--ink); background: var(--sheet); border-color: var(--ink); border-bottom: 2px solid var(--sheet); }
.tab small { font-family: var(--font-mono); font-size: 12px; margin-left: 4px; color: var(--bad); }

/* Notes */
.notes { display: grid; gap: 22px; align-items: start; }
.notes > *, .deck > *, .content { min-width: 0; }
.content { display: flex; flex-direction: column; gap: 16px; }
.toc { position: sticky; top: 14px; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 28px); overflow-y: auto; padding-right: 4px; }
.toc h3 { font-family: var(--font-hand); font-size: 20px; margin: 10px 0 2px; color: var(--pen); }
.toc a { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; align-items: baseline; text-decoration: none; color: var(--ink); padding: 4px 8px; border-radius: 9px; font-size: 14.5px; }
.toc a:hover { background: var(--sheet); }
.toc a .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.toc a .p { font-family: var(--font-mono); font-size: 11px; color: var(--good); }
.toc a.on { background: var(--sheet); box-shadow: inset 3px 0 0 var(--hl); }
@media (max-width: 900px) { .notes { grid-template-columns: 1fr; } .toc { display: none; } }
.bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 10px 14px; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(6px); border: 1.5px solid var(--line); border-radius: 14px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch .tr { width: 42px; height: 24px; border-radius: 12px; background: var(--line); position: relative; transition: background .15s; }
.switch .tr::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--sheet); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: left .15s; }
.switch input:checked + .tr { background: var(--ink); }
.switch input:checked + .tr::after { left: 21px; }
.switch input:focus-visible + .tr { outline: 2px solid var(--pen); outline-offset: 2px; }
.bar .cnt { font-family: var(--font-mono); font-size: 13px; color: var(--muted); margin-left: auto; }
.chap { font-family: var(--font-hand); font-size: 30px; font-weight: 700; color: var(--pen); margin: 18px 0 -4px; }
.sheet { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 18px; padding: 22px 26px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 70px; }
.sheet > h2 { margin: 0; display: flex; align-items: baseline; gap: 10px; font-family: var(--font-hand); font-size: 32px; line-height: 1.15; font-weight: 700; }
.sheet > h2 .no { font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: var(--paper); background: var(--ink); border-radius: 7px; padding: 1px 8px; transform: translateY(-4px); }
.sheet h4 { margin: 6px 0 -4px; font-size: 17px; font-weight: 700; }
.sheet h4::before { content: "▸ "; color: var(--pen); }
.sheet p { margin: 0; }
.kv { display: grid; grid-template-columns: minmax(110px, 150px) 1fr; border-top: 1.5px solid var(--ink); }
.kv > div { padding: 8px 10px; border-bottom: 1px solid var(--line); }
.kv .k { font-weight: 700; background: color-mix(in srgb, var(--paper) 70%, var(--sheet)); }
.kv .k small { display: block; font-family: var(--font-mono); font-size: 11.5px; font-weight: 400; color: var(--muted); }
@media (max-width: 560px) { .kv { grid-template-columns: 1fr; } .kv .k { border-bottom: 0; padding-bottom: 0; background: none; } .sheet { padding: 18px 16px; } }
.sheet ul, .sheet ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; min-width: 420px; font-size: 15px; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 6px 10px; text-align: center; vertical-align: middle; }
.tbl th { background: color-mix(in srgb, var(--paper) 70%, var(--sheet)); font-weight: 700; }
.tbl td:first-child { font-weight: 700; }
.box { border: 1.5px dashed var(--pen); border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.box > b { font-family: var(--font-hand); font-size: 22px; color: var(--pen); line-height: 1.2; }
.box.tip { border-color: var(--pink); border-style: solid; background: color-mix(in srgb, var(--pink) 9%, var(--sheet)); }
.box.tip > b { color: var(--ink); }
.box.prob > b { color: var(--bad); }
.sheet-foot { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 12px; }
.fix { font-size: 14px; color: var(--bad); }

/* Units (one per tab) */
:root { --c14: #2850C8; --c15: #1C8455; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c14: #8EA9FF; --c15: #5ACB8C; } }
:root[data-theme="dark"] { --c14: #8EA9FF; --c15: #5ACB8C; }
.ch14 { --cc: var(--c14); }
.ch15 { --cc: var(--c15); }
.ch18 { --cc: var(--c14); }
.ch1, .ch3 { --cc: var(--c14); }
.ch2, .ch4 { --cc: var(--c15); }
.ch19 { --cc: var(--c15); }
.notes { grid-template-columns: 250px minmax(0, 1fr); }
.units { position: sticky; top: 14px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 28px); overflow-y: auto; padding: 2px 4px 2px 2px; }
.ugroup { display: flex; flex-direction: column; gap: 3px; }
.ugroup h3 { margin: 0 0 4px; font-family: var(--font-hand); font-size: 21px; color: var(--cc); line-height: 1.2; }
.unit { border: 1.5px solid transparent; background: transparent; border-radius: 12px; padding: 7px 10px; text-align: left; display: grid; grid-template-columns: 30px 1fr; grid-template-rows: auto auto; column-gap: 6px; row-gap: 3px; align-items: center; font-size: 14.5px; line-height: 1.35; }
.unit:hover { background: var(--sheet); }
.unit .un { grid-row: span 2; font-family: var(--font-mono); font-size: 12px; font-weight: 600; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--cc); color: var(--cc); }
.unit .up { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.unit .up i { display: block; height: 100%; background: var(--good); }
.unit[aria-current="true"] { background: var(--sheet); border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.unit[aria-current="true"] .un { background: var(--cc); color: var(--sheet); }
.page { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hero { position: relative; background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 20px; box-shadow: 6px 6px 0 var(--cc); padding: 18px 22px; display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--cc) 14%, transparent) 0 60%, transparent 61%); pointer-events: none; }
.hero-l { display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; z-index: 1; }
.chap-chip { align-self: flex-start; font-size: 13px; font-weight: 700; color: var(--cc); border: 1.5px solid currentColor; border-radius: 999px; padding: 0 10px; }
.hero-t { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.big-no { font-family: var(--font-hand); font-weight: 700; font-size: 64px; line-height: .9; color: var(--cc); background: linear-gradient(transparent 62%, var(--hl-soft) 62%); padding: 0 4px; }
.hero h2 { margin: 0; font-family: var(--font-hand); font-weight: 700; font-size: 38px; line-height: 1.1; text-wrap: balance; }
.hero-r { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; position: relative; z-index: 1; }
.facts { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.page .sheet { position: relative; padding-left: 40px; }
.page .sheet::before { content: ""; position: absolute; left: 22px; top: 14px; bottom: 14px; width: 2px; background: color-mix(in srgb, var(--pink) 55%, transparent); border-radius: 2px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pg { border: 1.5px solid var(--line); background: var(--sheet); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; text-align: left; min-width: 0; }
.pg.next { text-align: right; align-items: flex-end; }
.pg small { color: var(--muted); font-size: 13px; }
.pg b { font-family: var(--font-hand); font-size: 22px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.pg:hover { border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
@media (max-width: 900px) {
  .notes { grid-template-columns: 1fr; }
  .units { position: sticky; top: 0; z-index: 6; flex-direction: row; overflow-x: auto; max-height: none; gap: 10px; padding: 8px 20px; margin: 0 -20px; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1.5px solid var(--line); }
  .ugroup { flex-direction: row; align-items: center; gap: 6px; }
  .ugroup h3 { font-size: 17px; white-space: nowrap; margin: 0 2px 0 0; }
  .unit { display: flex; gap: 6px; white-space: nowrap; padding: 4px 10px 4px 4px; border-color: var(--line); background: var(--sheet); }
  .unit .up { display: none; }
  .unit .un { width: 24px; height: 24px; font-size: 11px; }
  .unit[aria-current="true"] { box-shadow: 2px 2px 0 var(--ink); }
  .bar { top: 54px; }
  .hero { padding: 16px; }
  .hero-r { align-items: flex-start; }
  .big-no { font-size: 48px; }
  .hero h2 { font-size: 30px; }
  .page .sheet { padding-left: 30px; }
  .page .sheet::before { left: 14px; }
  .pager { grid-template-columns: 1fr; }
}

/* Figures */
.figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 18px; padding: 8px 2px 6px; }
.fig { position: relative; border: 0; background: var(--sheet); border-radius: 6px; padding: 10px 10px 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, .12), 0 8px 18px rgba(29, 41, 36, .12); display: flex; flex-direction: column; gap: 8px; text-align: left; transform: rotate(-1.2deg); transition: transform .18s ease, box-shadow .18s ease; }
.fig:nth-child(2n) { transform: rotate(1deg); }
.fig:hover, .fig:focus-visible { transform: rotate(0) translateY(-3px); box-shadow: 0 2px 4px rgba(0, 0, 0, .14), 0 14px 28px rgba(29, 41, 36, .18); }
.tape { position: absolute; top: -9px; left: 50%; width: 74px; height: 20px; transform: translateX(-50%) rotate(-3deg); background: color-mix(in srgb, var(--hl) 70%, transparent); opacity: .85; border-radius: 2px; box-shadow: 0 1px 1px rgba(0, 0, 0, .08); }
.fig:nth-child(3n+2) .tape { background: color-mix(in srgb, var(--pink) 70%, transparent); transform: translateX(-50%) rotate(4deg); }
.fig:nth-child(3n) .tape { background: color-mix(in srgb, var(--cc, var(--pen)) 35%, transparent); }
.fig-img { display: grid; place-items: center; height: 150px; background: #fff; border-radius: 3px; overflow: hidden; }
.fig-img img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.fig-cap { font-size: 13.5px; line-height: 1.45; color: var(--ink); }
.fig-cap b { font-family: var(--font-hand); font-size: 17px; color: var(--cc, var(--pen)); margin-right: 4px; }
.fig-open { font-size: 12px; font-weight: 700; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .fig, .fig:nth-child(2n), .fig:hover { transform: none; transition: none; } }

/* Lightbox */
#lb { width: min(1100px, calc(100vw - 20px)); max-width: none; height: min(860px, calc(100vh - 20px)); max-height: none; border: 0; border-radius: 18px; padding: 0; background: #12130F; color: #F3F1E8; }
#lb::backdrop { background: rgba(8, 10, 8, .75); }
.lb { display: flex; flex-direction: column; height: 100%; }
.lb-top, .lb-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; }
.lb .btn { background: #22241E; border-color: #34372E; color: #F3F1E8; }
.lb-frame { flex: 1; min-height: 0; display: grid; place-items: center; background: #fff; margin: 0 14px; border-radius: 10px; overflow: auto; }
.lb-frame img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; cursor: zoom-in; }
.lb-frame.zoom { place-items: start; }
.lb-frame.zoom img { max-width: none; max-height: none; cursor: zoom-out; }
#lb-cap { margin: 0; text-align: center; font-size: 15px; flex: 1; }
#lb-n { color: #B9BDAE; font-size: 13px; }

/* Blanks */
.bl { background: linear-gradient(transparent 50%, var(--hl-soft) 50%); border-radius: 3px; padding: 0 2px; font-weight: 700; }
.hide .bl { color: transparent; background: var(--hl); cursor: pointer; user-select: none; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .08); transition: background .15s; }
.hide .bl:hover { background: color-mix(in srgb, var(--hl) 80%, var(--ink)); }
.hide .bl.open { color: inherit; background: linear-gradient(transparent 50%, var(--hl-soft) 50%); cursor: default; box-shadow: none; }
.hide .bl.open::after { content: ""; }

/* Cards */
.deck { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .deck { grid-template-columns: 1fr; } }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
@media (max-width: 640px) { .chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; margin: 0 -20px; padding-left: 20px; padding-right: 20px; } .chips.scroll .chip { white-space: nowrap; } .bar .cnt { margin-left: 0; width: 100%; } }
.chip { border: 1.5px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 2px 12px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 700; }
.stage { perspective: 1400px; }
.card { position: relative; min-height: 330px; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3, .7, .3, 1); cursor: pointer; }
.card.flip { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 var(--ink); padding: 26px 30px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.face.back { transform: rotateY(180deg); background: color-mix(in srgb, var(--hl) 14%, var(--sheet)); }
.face .tag { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.face .q { font-family: var(--font-hand); font-size: 34px; line-height: 1.25; font-weight: 700; margin: auto 0; text-wrap: balance; }
.face .a { font-size: 21px; line-height: 1.7; margin: auto 0; white-space: pre-line; }
.face .hint { font-size: 13px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.grade .btn { padding: 12px 8px; font-size: 16px; flex-direction: column; gap: 0; }
.grade .btn small { font-family: var(--font-mono); font-size: 11px; opacity: .65; font-weight: 400; }
.g1 { border-color: var(--bad) !important; color: var(--bad); }
.g2 { border-color: var(--mid) !important; color: var(--mid); }
.g3 { border-color: var(--good) !important; color: var(--good); }
.side { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.side h3 { margin: 0; font-family: var(--font-hand); font-size: 22px; }
.boxes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.boxes div { border-radius: 10px; padding: 6px 2px; background: var(--paper); }
.boxes b { display: block; font-family: var(--font-hand); font-size: 26px; line-height: 1.1; }
.boxes span { font-size: 12px; color: var(--muted); }
.stack-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; background: var(--paper); }
.stack-bar i { display: block; height: 100%; }

/* Quiz */
.qwrap { max-width: 820px; display: flex; flex-direction: column; gap: 14px; }
.qcard { background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 20px; box-shadow: 6px 6px 0 var(--ink); padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; }
.qhead { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.qtext { font-size: 21px; font-weight: 700; line-height: 1.6; margin: 0; white-space: pre-line; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--paper); border-radius: 14px; padding: 10px 14px; display: grid; grid-template-columns: 30px 1fr; gap: 6px; align-items: baseline; font-size: 17px; }
.opt:hover:not([disabled]) { border-color: var(--ink); }
.opt .ln { font-family: var(--font-hand); font-weight: 700; font-size: 22px; color: var(--pen); line-height: 1; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--sheet)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--sheet)); }
.opt[disabled] { cursor: default; }
.ox { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ox .opt { grid-template-columns: 1fr; text-align: center; font-family: var(--font-hand); font-size: 44px; font-weight: 700; padding: 6px; }
.exp { border-top: 1.5px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.verdict { font-family: var(--font-hand); font-size: 28px; font-weight: 700; line-height: 1.1; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.qprog { height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; }
.qprog i { display: block; height: 100%; background: var(--ink); }
.score { font-family: var(--font-hand); font-weight: 700; font-size: 72px; line-height: 1; }
.setup { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.setup h3 { margin: 0; font-family: var(--font-hand); font-size: 24px; }
.wlist { display: flex; flex-direction: column; gap: 10px; }
.witem { background: var(--sheet); border: 1.5px solid var(--line); border-left: 5px solid var(--bad); border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.witem .wa { color: var(--good); font-weight: 700; }
.witem .we { font-size: 14.5px; color: var(--muted); }

/* Tools */
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: start; }
.tool { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.tool h3 { margin: 0; font-family: var(--font-hand); font-size: 26px; line-height: 1.1; }
.tool p.d { margin: 0; font-size: 14px; color: var(--muted); }
.field { border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 6px 10px; width: 100%; min-width: 0; }
.field.mono { font-family: var(--font-mono); }
.f2 { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.f4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.f4 label { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; font-family: var(--font-mono); color: var(--muted); }
.out { background: var(--paper); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.out .big { font-family: var(--font-hand); font-size: 30px; font-weight: 700; line-height: 1.1; }
.out .err { color: var(--bad); }
.pun { overflow-x: auto; }
.pun table { border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; }
.pun th, .pun td { border: 1px solid var(--line); padding: 4px 7px; text-align: center; }
.pun th { background: color-mix(in srgb, var(--hl) 30%, var(--sheet)); }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 12px; font-size: 14.5px; z-index: 50; max-width: calc(100vw - 32px); }
.note-line { font-size: 13px; color: var(--muted); margin: 0; }
</style>
</head>

      wrongs.length ? h("button", { class: "btn ink", type: "button", text: "틀린 문제만 다시", onclick: function () { startQuiz(wrongs.map(function (id) { return QUIZ.find(function (x) { return x.id === id; }); })); } }) : null,
      h("button", { class: "btn", type: "button", text: "새 퀴즈", onclick: function () { quiz = null; render(); } })));
    w.appendChild(box);
  }
  function quizSetup(w) {
    var any = Object.keys(qset.secs).some(function (k) { return qset.secs[k]; });
    var chips = h("div", { class: "chips" });
    chips.appendChild(h("button", { class: "chip", type: "button", "aria-pressed": String(!any), onclick: function () { qset.secs = {}; render(); } }, "전체 범위"));
    SECS.forEach(function (s) {
      var n = QUIZ.filter(function (q) { return q.sec === s.id; }).length; if (!n) return;
      chips.appendChild(h("button", { class: "chip", type: "button", "aria-pressed": String(!!qset.secs[s.id]), onclick: function () { qset.secs[s.id] = !qset.secs[s.id]; render(); } }, s.ch + "-" + s.no + " " + s.title + " (" + n + ")"));
    });
    var pool = QUIZ.filter(function (q) { return !any || qset.secs[q.sec]; });
    var nsel = h("div", { class: "chips" });
    [10, 20, 0].forEach(function (n) {
      nsel.appendChild(h("button", { class: "chip", type: "button", "aria-pressed": String(qset.n === n), onclick: function () { qset.n = n; render(); } }, n ? n + "문제" : "전부 (" + pool.length + ")"));
    });
    var tries = 0, right = 0;
    pool.forEach(function (q) { var s = P.qs[q.id]; if (s) { right += s[0]; tries += s[1]; } });
    w.appendChild(h("section", { class: "setup" },
      h("h3", { text: "어디서 낼까요?" }), chips,
      h("h3", { text: "몇 문제?" }), nsel,
      h("div", { class: "row" },
        h("button", { class: "btn ink", type: "button", text: "퀴즈 시작", onclick: function () { startQuiz(pool, qset.n || pool.length); } }),
        h("span", { class: "note-line", text: "고른 범위 " + pool.length + "문제" + (tries ? " · 지금까지 정답률 " + Math.round(right / tries * 100) + "%" : "") }))));
    w.appendChild(h("p", { class: "note-line", text: "틀린 문제는 오답 노트에 자동으로 모이고, 나중에 맞히면 빠집니다." }));
  }

  /* ========================================================= wrong notes */
  function wrongItem(q, withBtn) {
    return h("div", { class: "witem" },
      h("b", { text: q.q }),
      h("span", { class: "wa", text: "정답: " + q.c[q.ans] }),
      h("span", { class: "we", text: q.e }),
      withBtn ? h("div", { class: "row" }, h("button", { class: "btn sm", type: "button", text: "이제 알아요, 빼기", onclick: function () { P.wrong = P.wrong.filter(function (x) { return x !== q.id; }); save(); render(); } })) : null);
  }
  function viewWrong(root) {
    var w = h("div", { class: "qwrap" });
    var qs = P.wrong.map(function (id) { return QUIZ.find(function (x) { return x.id === id; }); }).filter(Boolean);
    if (!qs.length) {
      w.appendChild(h("div", { class: "qcard" }, h("div", { class: "verdict ok", text: "오답 노트가 비어 있어요" }), h("p", { style: "margin:0", text: "퀴즈에서 틀린 문제가 여기에 모입니다." }),
        h("div", { class: "row" }, h("button", { class: "btn ink", type: "button", text: "퀴즈 풀러 가기", onclick: function () { quiz = null; go("quiz"); } }))));
    } else {
      w.appendChild(h("div", { class: "row" },
        h("button", { class: "btn ink", type: "button", text: "오답 " + qs.length + "문제 다시 풀기", onclick: function () { startQuiz(qs); } })));
      var wl = h("div", { class: "wlist" });
      qs.forEach(function (q) { wl.appendChild(wrongItem(q, true)); });
      w.appendChild(wl);
    }
    root.appendChild(w);
  }

  /* ========================================================= tools */
  var G = 6.674e-11, MSUN = 1.989e30, KPC = 3.0857e19, MPC = 3.0857e22, YR = 3.156e7;
  function sci(x, d) { if (!isFinite(x)) return "—"; var e = Math.floor(Math.log10(Math.abs(x))); return (x / Math.pow(10, e)).toFixed(d == null ? 2 : d) + " × 10^" + e; }
  function viewTools(root) {
    var grid = h("div", { class: "tools" });
    root.appendChild(grid);

    /* 1. galaxy mass */
    var r = h("input", { class: "field mono", id: "gm-r", type: "number", step: "0.5", min: "0", value: "15", "aria-label": "거리 kpc" });
    var v = h("input", { class: "field mono", id: "gm-v", type: "number", step: "5", min: "0", value: "230", "aria-label": "회전 속도 km/s" });
    var vis = h("input", { class: "field mono", id: "gm-vis", type: "number", step: "0.1", min: "0", value: "1", "aria-label": "보이는 물질 질량 10^11" });
    var out1 = h("div", { class: "out", "aria-live": "polite" });
    function gm() {
      out1.textContent = "";
      var R = Number(r.value), V = Number(v.value), M0 = Number(vis.value);
      if (!(R > 0) || !(V > 0)) { out1.appendChild(h("span", { class: "err", text: "거리와 회전 속도를 0보다 크게 넣어 주세요." })); return; }
      var M = R * KPC * Math.pow(V * 1000, 2) / G / MSUN;
      out1.appendChild(h("div", { class: "big", text: "M ≈ " + (M / 1e11).toFixed(2) + " × 10¹¹ M☉" }));
      out1.appendChild(h("span", { class: "mono", text: "M = rv²/G = (" + R + " kpc)(" + V + " km/s)² / G" }));
      if (M0 >= 0) {
        var dark = M / 1e11 - M0;
        out1.appendChild(h("span", { text: dark > 0 ? "보이는 물질 " + M0 + " × 10¹¹ M☉을 빼면 암흑 물질 약 " + dark.toFixed(2) + " × 10¹¹ M☉ (" + Math.round(dark / (M / 1e11) * 100) + "%)" : "보이는 물질만으로 설명됩니다." }));
      }
    }
    [r, v, vis].forEach(function (x) { x.addEventListener("input", gm); });
    grid.appendChild(h("section", { class: "tool" }, h("h3", { text: "은하 질량 계산기" }),
      h("p", { class: "d", text: "은하 중심에서의 거리와 회전 속도로 그 안쪽 질량을 구하고, 보이는 물질 질량을 빼서 암흑 물질 양을 알려 줍니다." }),
      h("div", { class: "f4" }, h("label", { for: "gm-r" }, "거리 kpc", r), h("label", { for: "gm-v" }, "회전 속도 km/s", v), h("label", { for: "gm-vis" }, "보이는 질량 ×10¹¹", vis)),
      out1));
    gm();

    /* 2. Hubble */
    var Hc = h("input", { class: "field mono", id: "hb-h", type: "number", step: "1", min: "1", value: "70", "aria-label": "허블 상수" });
    var z = h("input", { class: "field mono", id: "hb-z", type: "number", step: "0.001", min: "0", value: "0.05", "aria-label": "적색 편이" });
    var out2 = h("div", { class: "out", "aria-live": "polite" });
    function hb() {
      out2.textContent = "";
      var H0 = Number(Hc.value), Z = Number(z.value);
      if (!(H0 > 0) || !(Z >= 0)) { out2.appendChild(h("span", { class: "err", text: "허블 상수와 적색 편이를 넣어 주세요." })); return; }
      var vel = 3e5 * Z, d = vel / H0, Hsi = H0 * 1000 / MPC, age = 1 / Hsi / YR, rhoc = 3 * Hsi * Hsi / (8 * Math.PI * G);
      out2.appendChild(h("div", { class: "big", text: "v = " + Math.round(vel).toLocaleString() + " km/s · d ≈ " + Math.round(d).toLocaleString() + " Mpc" }));
      out2.appendChild(h("span", { class: "mono", text: "v = c·z, d = v/H" }));
      out2.appendChild(h("span", { text: "우주 나이 t = 1/H ≈ " + (age / 1e8).toFixed(0) + "억 년" }));
      out2.appendChild(h("span", { text: "임계 밀도 ρc = 3H²/8πG ≈ " + sci(rhoc) + " kg/m³ (수소 원자 약 " + (rhoc / 1.67e-27).toFixed(1) + "개/m³)" }));
      if (Z > 0.1) out2.appendChild(h("span", { class: "muted", text: "z가 0.1보다 크면 v = cz는 근삿값이 됩니다." }));
    }
    [Hc, z].forEach(function (x) { x.addEventListener("input", hb); });
    grid.appendChild(h("section", { class: "tool" }, h("h3", { text: "허블 법칙 · 우주 나이 계산기" }),
      h("p", { class: "d", text: "허블 상수와 적색 편이로 후퇴 속도와 거리, 그리고 우주 나이(1/H)와 임계 밀도를 구합니다." }),
      h("div", { class: "f4" }, h("label", { for: "hb-h" }, "H (km/s/Mpc)", Hc), h("label", { for: "hb-z" }, "적색 편이 z", z)),
      out2));
    hb();

    /* 3. distance modulus */
    var m = h("input", { class: "field mono", id: "dm-m", type: "number", step: "0.1", value: "17", "aria-label": "겉보기 등급" });
    var M = h("input", { class: "field mono", id: "dm-M", type: "number", step: "0.1", value: "-19.3", "aria-label": "절대 등급" });
    var A = h("input", { class: "field mono", id: "dm-a", type: "number", step: "0.1", min: "0", value: "0", "aria-label": "성간 소광" });
    var out3 = h("div", { class: "out", "aria-live": "polite" });
    function dm() {
      out3.textContent = "";
      var mm = Number(m.value), MM = Number(M.value), AA = Number(A.value) || 0;
      if (isNaN(mm) || isNaN(MM)) { out3.appendChild(h("span", { class: "err", text: "등급을 넣어 주세요." })); return; }
      var d = Math.pow(10, (mm - MM - AA + 5) / 5);
      out3.appendChild(h("div", { class: "big", text: "d ≈ " + (d >= 1e6 ? (d / 1e6).toFixed(1) + " Mpc" : d >= 1e3 ? (d / 1e3).toFixed(1) + " kpc" : d.toFixed(1) + " pc") }));
      out3.appendChild(h("span", { class: "mono", text: "m − M = 5 log d − 5 + A → 거리 지수 " + (mm - MM).toFixed(2) }));
      out3.appendChild(h("span", { class: "muted", text: "Ia형 초신성의 최대 밝기 절대 등급은 약 −19.3입니다." }));
    }
    [m, M, A].forEach(function (x) { x.addEventListener("input", dm); });
    grid.appendChild(h("section", { class: "tool" }, h("h3", { text: "거리 지수 계산기" }),
      h("p", { class: "d", text: "표준 촉광의 겉보기 등급과 절대 등급으로 거리를 구합니다." }),
      h("div", { class: "f4" }, h("label", { for: "dm-m" }, "겉보기 m", m), h("label", { for: "dm-M" }, "절대 M", M), h("label", { for: "dm-a" }, "소광 A", A)),
      out3));
    dm();
  }

  /* ========================================================= keys + boot */
  document.addEventListener("keydown", function (e) {
    if (isTyping(e.target) || e.metaKey || e.ctrlKey || e.altKey || $("lb").open) return;
    if (view === "cards" && deck.queue[deck.i]) {
      if (e.key === " " && !(e.target.closest && e.target.closest("button:not(.card)"))) { e.preventDefault(); flip(); }
      else if (e.key === "1" || e.key === "2" || e.key === "3") grade(Number(e.key));
    } else if (view === "quiz" && quiz && quiz.list[quiz.i]) {
      var q = QUIZ.find(function (x) { return x.id === quiz.list[quiz.i]; });
      if (quiz.picked == null) {
        if (q.ox && (e.key === "o" || e.key === "O")) answer(0);
        else if (q.ox && (e.key === "x" || e.key === "X")) answer(1);
        else if (/^[1-4]$/.test(e.key) && Number(e.key) <= q.c.length) answer(Number(e.key) - 1);
      } else if (e.key === "Enter" && e.target.id !== "q-next") { e.preventDefault(); next(); }
    }
  });
  $("lb-x").addEventListener("click", closeLB);
  $("lb-prev").addEventListener("click", function () { if (LB.i > 0) { LB.i--; LB.zoom = false; paintLB(); } });
  $("lb-next").addEventListener("click", function () { if (LB.i < LB.list.length - 1) { LB.i++; LB.zoom = false; paintLB(); } });
  $("lb-zoom").addEventListener("click", function () { LB.zoom = !LB.zoom; paintLB(); });
  $("lb-img").addEventListener("click", function () { LB.zoom = !LB.zoom; paintLB(); });
  $("lb").addEventListener("click", function (e) { if (e.target === $("lb")) closeLB(); });
  document.addEventListener("keydown", function (e) {
    if ($("lb").open) {
      if (e.key === "ArrowLeft") { e.preventDefault(); $("lb-prev").click(); }
      else if (e.key === "ArrowRight") { e.preventDefault(); $("lb-next").click(); }
      return;
    }
    if (view !== "note" || isTyping(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
    var i = SECS.findIndex(function (x) { return x.id === noteSec; });
    if (e.key === "ArrowRight" && SECS[i + 1]) openSec(SECS[i + 1].id);
    else if (e.key === "ArrowLeft" && SECS[i - 1]) openSec(SECS[i - 1].id);
  });
  readHash();
  render();
  connect();
})();
</script>
</body>
</html>
